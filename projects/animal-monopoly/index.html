    &lt;p class=&quot;trade-note&quot;&gt;&lt;/p&gt;
    &lt;p class=&quot;trade-message&quot; role=&quot;status&quot;&gt;&lt;/p&gt;
    &lt;div class=&quot;trade-requests&quot; aria-label=&quot;Pending trade requests&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;
  &lt;div class=&quot;rent-controls&quot;&gt;
    &lt;label for=&quot;animal-rent-level&quot;&gt;Show rent for&lt;/label&gt;
    &lt;select id=&quot;animal-rent-level&quot;&gt;
      &lt;option value=&quot;0&quot;&gt;No houses&lt;/option&gt;&lt;option value=&quot;1&quot;&gt;1 house&lt;/option&gt;&lt;option value=&quot;2&quot;&gt;2 houses&lt;/option&gt;&lt;option value=&quot;3&quot;&gt;3 houses&lt;/option&gt;&lt;option value=&quot;4&quot;&gt;4 houses&lt;/option&gt;&lt;option value=&quot;5&quot;&gt;Hotel&lt;/option&gt;
    &lt;/select&gt;
    &lt;span class=&quot;rent-status&quot; aria-live=&quot;polite&quot;&gt;Suggested rent · No houses · Paid to the owner when another player lands here&lt;/span&gt;
  &lt;/div&gt;
  &lt;div class=&quot;board&quot; role=&quot;group&quot; aria-label=&quot;Animal Monopoly board: forty spaces, Go at bottom right, Jail at bottom left, $500 at top left, Go to Jail at top right&quot;&gt;
    &lt;div class=&quot;center&quot;&gt;
      &lt;div&gt;&lt;h2 class=&quot;heading&quot;&gt;ANIMAL MONOPOLY&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;Roll, buy &amp; trade preview&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;detail&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;
  &lt;div class=&quot;mobile&quot;&gt;&lt;div class=&quot;mobile-detail&quot; aria-live=&quot;polite&quot;&gt;Animal Monopoly · 40 spaces&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;animal-monopoly-map&#x27;);
      const groups = {
        &#x27;Brown&#x27;:{color:&#x27;#935d36&#x27;,price:50,baseRent:20,animals:[&#x27;Grizzly bear&#x27;,&#x27;Sloth&#x27;,&#x27;Mouse&#x27;]},
        &#x27;Light blue&#x27;:{color:&#x27;#58c5ed&#x27;,price:70,baseRent:30,animals:[&#x27;Polar bear&#x27;,&#x27;Penguin&#x27;,&#x27;Dolphin&#x27;]},
        &#x27;Pink&#x27;:{color:&#x27;#ed88ba&#x27;,price:90,baseRent:40,animals:[&#x27;Gazelle&#x27;,&#x27;Cat&#x27;,&#x27;Rabbit&#x27;]},
        &#x27;Purple&#x27;:{color:&#x27;#9a71ca&#x27;,price:110,baseRent:50,animals:[&#x27;Gorilla&#x27;,&#x27;Seal&#x27;,&#x27;Wolf&#x27;]},
        &#x27;Orange&#x27;:{color:&#x27;#ed963f&#x27;,price:130,baseRent:60,animals:[&#x27;Otter&#x27;,&#x27;Kangaroo&#x27;,&#x27;Tiger&#x27;]},
        &#x27;Red&#x27;:{color:&#x27;#dc4c53&#x27;,price:150,baseRent:70,animals:[&#x27;Eagle&#x27;,&#x27;Fox&#x27;,&#x27;Flamingo&#x27;]},
        &#x27;Yellow&#x27;:{color:&#x27;#e5ce38&#x27;,price:170,baseRent:80,animals:[&#x27;Falcon&#x27;,&#x27;Rhino&#x27;,&#x27;Cheetah&#x27;]},
        &#x27;Light green&#x27;:{color:&#x27;#a4d963&#x27;,price:190,baseRent:90,animals:[&#x27;Monkey&#x27;,&#x27;Giraffe&#x27;,&#x27;Koala&#x27;]},
        &#x27;Dark green&#x27;:{color:&#x27;#2e8761&#x27;,price:210,baseRent:100,animals:[&#x27;Crocodile&#x27;,&#x27;Cow&#x27;,&#x27;Turtle&#x27;]},
        &#x27;Dark blue&#x27;:{color:&#x27;#3968c8&#x27;,price:230,baseRent:110,animals:[&#x27;Zebra&#x27;,&#x27;Shark&#x27;,&#x27;Hippo&#x27;]},
        &#x27;Black&#x27;:{color:&#x27;#262729&#x27;,price:250,baseRent:120,animals:[&#x27;Panda&#x27;,&#x27;Elephant&#x27;]}
      };
      const sides = [
        {heading:&#x27;Bottom · Go → Jail&#x27;,names:[&#x27;Dolphin&#x27;,&#x27;Tiger&#x27;,&#x27;Giraffe&#x27;,&#x27;Rhino&#x27;,&#x27;Mystery Card&#x27;,&#x27;Hippo&#x27;,&#x27;Gazelle&#x27;,&#x27;Eagle&#x27;,&#x27;Grizzly bear&#x27;],draft:[0,1,3]},
        {heading:&#x27;Left · Jail → $500&#x27;,names:[&#x27;Zebra&#x27;,&#x27;Falcon&#x27;,&#x27;Monkey&#x27;,&#x27;Shark&#x27;,&#x27;Mystery Card&#x27;,&#x27;Polar bear&#x27;,&#x27;Panda&#x27;,&#x27;Gorilla&#x27;,&#x27;Crocodile&#x27;],draft:[]},
        {heading:&#x27;Top · $500 → Go to Jail&#x27;,names:[&#x27;Fox&#x27;,&#x27;Otter&#x27;,&#x27;Cat&#x27;,&#x27;Elephant&#x27;,&#x27;Mystery Card&#x27;,&#x27;Turtle&#x27;,&#x27;Seal&#x27;,&#x27;Rabbit&#x27;,&#x27;Mouse&#x27;],draft:[0,1,2,3,4,5,6,7,8]},
        {heading:&#x27;Right · Go to Jail → Go&#x27;,names:[&#x27;Penguin&#x27;,&#x27;Sloth&#x27;,&#x27;Flamingo&#x27;,&#x27;Cheetah&#x27;,&#x27;Mystery Card&#x27;,&#x27;Wolf&#x27;,&#x27;Kangaroo&#x27;,&#x27;Koala&#x27;,&#x27;Cow&#x27;],draft:[0,1,2,3,4,5,6,7,8]}
      ];
      const board=root.querySelector(&#x27;.board&#x27;);
      const mobile=root.querySelector(&#x27;.mobile&#x27;);
      const animalGroups=Object.fromEntries(Object.entries(groups).flatMap(([group,data])=&gt;data.animals.map(name=&gt;[name,group])));
      const buttons=[];
      const allTiles=[];
      const levels=[&#x27;No houses&#x27;,&#x27;1 house&#x27;,&#x27;2 houses&#x27;,&#x27;3 houses&#x27;,&#x27;4 houses&#x27;,&#x27;Hotel&#x27;];
      const multipliers=[1,2,4,6,8,10];
      const levelControl=root.querySelector(&#x27;#animal-rent-level&#x27;);
      const cornerNames=[&#x27;Go&#x27;,&#x27;Jail&#x27;,&#x27;$500&#x27;,&#x27;Go to Jail&#x27;];
      const track=sides.flatMap((side,i)=&gt;[cornerNames[i],...side.names]);
      let selectedAnimal=null;
      let rentLevel=0;
      let position=0;
      let cash=2000;
      let owned=new Set();
      let lastRoll=0;
      let lastDice=[0,0];
      let turnMessage=&#x27;Player 1 starts on Go. Roll to move.&#x27;;
      let players=[{id:1,position:0,cash:2000,owned:[],lastRoll:0}];
      let activePlayer=1;
      let requests=[];
      let nextRequestId=1;
      let tradeOpen=false;
      let tradeMessage=&#x27;&#x27;;
      let gameStarted=false;
      let hasSavedGame=false;
      let turnPhase=&#x27;roll&#x27;;
      const money=value=&gt;&#x27;$&#x27;+value.toLocaleString(&#x27;en-US&#x27;);
      const playerName=id=&gt;&#x27;Player &#x27;+id;
      const getPlayer=id=&gt;players.find(player=&gt;player.id===id);
      const countControl=root.querySelector(&#x27;#monopoly-player-count&#x27;);
      const ownerControl=root.querySelector(&#x27;.trade-owner&#x27;);
      const propertyControl=root.querySelector(&#x27;.trade-property&#x27;);
      const offerControl=root.querySelector(&#x27;.trade-price&#x27;);
      const purchasePrice=name=&gt;groups[animalGroups[name]].price*2;
      const panels=[root.querySelector(&#x27;.detail&#x27;),root.querySelector(&#x27;.mobile-detail&#x27;)];
      function syncPlayer() {
        Object.assign(getPlayer(activePlayer),{position,cash,owned:[...owned],lastRoll});
      }
      function loadPlayer() {
        const player=getPlayer(activePlayer);
        position=player.position; cash=player.cash; owned=new Set(player.owned); lastRoll=player.lastRoll;
      }
      function ownerOf(name) {
        if(owned.has(name)) return activePlayer;
        return players.find(player=&gt;player.id!==activePlayer&amp;&amp;player.owned.includes(name))?.id??null;
      }
      function select(group,name) {
        selectedAnimal=name;
        const data=groups[group];
        buttons.forEach(button=&gt;{
          button.classList.toggle(&#x27;is-related&#x27;,button.dataset.group===group);
          button.setAttribute(&#x27;aria-pressed&#x27;,String(button.dataset.name===name));
        });
        const rows=levels.map((label,i)=&gt;&#x27;&lt;tr&#x27;+(i===rentLevel?&#x27; class=&quot;shown-level&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;th scope=&quot;row&quot;&gt;&#x27;+label+&#x27;&lt;/th&gt;&lt;td&gt;&#x27;+money(data.baseRent*multipliers[i])+&#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;).join(&#x27;&#x27;);
        const price=purchasePrice(name);
        const owner=ownerOf(name);
        const isOwned=owner===activePlayer;
        const otherOwner=owner!==null&amp;&amp;!isOwned;
        const onProperty=track[position]===name;
        const canBuy=gameStarted&amp;&amp;turnPhase===&#x27;action&#x27;&amp;&amp;onProperty&amp;&amp;owner===null&amp;&amp;cash&gt;=price;
        const groupCount=data.animals.filter(animal=&gt;owned.has(animal)).length;
        const buttonText=isOwned?&#x27;Owned by &#x27;+playerName(owner):otherOwner?&#x27;Request to buy from &#x27;+playerName(owner):!onProperty?&#x27;Land here to buy&#x27;:turnPhase!==&#x27;action&#x27;?&#x27;Roll to move first&#x27;:cash&lt;price?&#x27;Need &#x27;+money(price-cash)+&#x27; more&#x27;:&#x27;Buy &#x27;+name+&#x27; · &#x27;+money(price);
        const markup=&#x27;&lt;h3 class=&quot;detail-title&quot;&gt;&#x27;+name+&#x27;&lt;/h3&gt;&lt;div class=&quot;detail-meta&quot;&gt;&#x27;+group+&#x27; group · &#x27;+(owner!==null?&#x27;Owner: &#x27;+playerName(owner):&#x27;Unowned&#x27;)+&#x27;&lt;/div&gt;&lt;div class=&quot;purchase-summary&quot;&gt;&lt;span&gt;Bank price: &lt;strong&gt;&#x27;+money(price)+&#x27;&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;Your cash: &lt;strong&gt;&#x27;+money(cash)+&#x27;&lt;/strong&gt;&lt;/span&gt;&lt;/div&gt;&lt;table class=&quot;rent-table&quot; aria-label=&quot;Suggested rent for &#x27;+name+&#x27;&quot;&gt;&lt;tbody&gt;&#x27;+rows+&#x27;&lt;/tbody&gt;&lt;/table&gt;&lt;div class=&quot;detail-meta&quot;&gt;House: &#x27;+money(data.price)+&#x27; · Hotel construction: &#x27;+money(data.price*5)+&#x27; total&lt;div class=&quot;group-members&quot;&gt;&#x27;+data.animals.map(animal=&gt;animal+(owned.has(animal)?&#x27; ✓&#x27;:&#x27;&#x27;)).join(&#x27; · &#x27;)+&#x27;&lt;/div&gt;Your group: &#x27;+groupCount+&#x27;/&#x27;+data.animals.length+&#x27;&lt;/div&gt;&lt;div class=&quot;buy-action&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;game-button buy-button cursor-interaction&quot;&#x27;+(canBuy||otherOwner?&#x27;&#x27;:&#x27; disabled&#x27;)+&#x27;&gt;&#x27;+buttonText+&#x27;&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;group-rules&quot;&gt;Own the full group to build. Uneven building is allowed. The fifth house becomes a hotel automatically.&lt;/div&gt;&#x27;;
        panels.forEach(panel=&gt;{
          panel.innerHTML=markup;
          panel.querySelector(&#x27;.buy-button&#x27;).addEventListener(&#x27;click&#x27;,()=&gt;otherOwner?openTrade(name):buy(name));
        });
      }
      function showSpecial() {
        selectedAnimal=null;
        const name=track[position];
        buttons.forEach(button=&gt;{button.classList.toggle(&#x27;is-related&#x27;,false);button.setAttribute(&#x27;aria-pressed&#x27;,&#x27;false&#x27;);});
        const description={Go:&#x27;Collect $200 each time your move reaches or passes Go.&#x27;,Jail:&#x27;Jail and release rules still need to be set.&#x27;,&#x27;$500&#x27;:&#x27;The collect or pay rule for this corner still needs to be set.&#x27;,&#x27;Go to Jail&#x27;:&#x27;Jail movement is not active in this preview.&#x27;,&#x27;Mystery Card&#x27;:&#x27;15 cards proposed. Card drawing is not active in this preview.&#x27;}[name];
        panels.forEach(panel=&gt;{
          panel.innerHTML=&#x27;&lt;h3 class=&quot;detail-title&quot;&gt;&#x27;+name+&#x27;&lt;/h3&gt;&lt;p&gt;&#x27;+description+&#x27;&lt;/p&gt;&lt;div class=&quot;detail-meta&quot;&gt;&#x27;+playerName(activePlayer)+&#x27; · &#x27;+money(cash)+&#x27; · &#x27;+owned.size+&#x27; animals owned&lt;/div&gt;&#x27;;
        });
      }
      function refreshPanel() {
        if(selectedAnimal&amp;&amp;animalGroups[selectedAnimal]) select(animalGroups[selectedAnimal],selectedAnimal);
        else showSpecial();
      }
      function buy(name) {
        if(!gameStarted||turnPhase!==&#x27;action&#x27;||track[position]!==name||ownerOf(name)!==null||!animalGroups[name]) return;
        const price=purchasePrice(name);
        if(cash&lt;price) return;
        cash-=price;
        owned.add(name);
        turnMessage=&#x27;Bought &#x27;+name+&#x27; for &#x27;+money(price)+&#x27;. Cash remaining: &#x27;+money(cash)+&#x27;.&#x27;;
        render();
        saveState();
      }
      function roll() {
        if(!gameStarted||turnPhase!==&#x27;roll&#x27;) return;
        lastDice=[Math.floor(Math.random()*6)+1,Math.floor(Math.random()*6)+1];
        lastRoll=lastDice[0]+lastDice[1];
        const nextPosition=position+lastRoll;
        const goBonus=Math.floor(nextPosition/track.length)*200;
        cash+=goBonus;
        position=nextPosition%track.length;
        turnPhase=&#x27;action&#x27;;
        const name=track[position];
        selectedAnimal=animalGroups[name]?name:null;
        turnMessage=playerName(activePlayer)+&#x27; rolled &#x27;+lastDice[0]+&#x27; + &#x27;+lastDice[1]+&#x27; = &#x27;+lastRoll+&#x27; · Landed on &#x27;+name+&#x27;.&#x27;+(goBonus?&#x27; Collected &#x27;+money(goBonus)+&#x27; for Go.&#x27;:&#x27;&#x27;)+(!animalGroups[name]&amp;&amp;name!==&#x27;Go&#x27;?&#x27; Special-space effect is not active yet.&#x27;:&#x27;&#x27;);
        render();
        saveState();
      }
      function setOptions(control,items,value) {
        control.replaceChildren();
        items.forEach(item=&gt;{
          const option=document.createElement(&#x27;option&#x27;);
          option.value=String(item.value); option.textContent=item.label;
          control.appendChild(option);
        });
        control.value=items.some(item=&gt;String(item.value)===String(value))?String(value):String(items[0]?.value??&#x27;&#x27;);
      }
      function fillTradeProperties(preferred) {
        const seller=getPlayer(Number(ownerControl.value));
        const before=propertyControl.value;
        const names=seller&amp;&amp;seller.id!==activePlayer?seller.owned:[];
        setOptions(propertyControl,names.map(name=&gt;({value:name,label:name})),preferred??before);
        const name=propertyControl.value;
        propertyControl.disabled=!name;
        offerControl.disabled=!name;
        root.querySelector(&#x27;.request-button&#x27;).disabled=!name;
        offerControl.max=String(cash);
        if(name&amp;&amp;(name!==before||!offerControl.value||preferred)) offerControl.value=String(purchasePrice(name));
        if(!name) offerControl.value=&#x27;&#x27;;
        root.querySelector(&#x27;.trade-note&#x27;).textContent=!names.length?(seller?playerName(seller.id)+&#x27; does not own any animals yet.&#x27;:&#x27;Choose another player.&#x27;):&#x27;Your cash: &#x27;+money(cash)+&#x27;. Money stays with you until the owner accepts. The owner reviews requests on their turn.&#x27;;
      }
      function openTrade(name) {
        if(!gameStarted) return;
        tradeOpen=true;
        renderTrades();
        const owner=name?ownerOf(name):null;
        if(owner!==null&amp;&amp;owner!==activePlayer) {ownerControl.value=String(owner);fillTradeProperties(name);}
      }
      function requestTrade(event) {
        event.preventDefault();
        if(!gameStarted) return;
        syncPlayer();
        const seller=Number(ownerControl.value),name=propertyControl.value,amount=Number(offerControl.value);
        if(!getPlayer(seller)||seller===activePlayer||ownerOf(name)!==seller) tradeMessage=&#x27;Choose an animal owned by another player.&#x27;;
        else if(!Number.isSafeInteger(amount)||amount&lt;=0) tradeMessage=&#x27;Enter a positive whole-dollar offer.&#x27;;
        else if(amount&gt;cash) tradeMessage=&#x27;Your offer exceeds your current cash.&#x27;;
        else if(requests.some(item=&gt;item.buyer===activePlayer&amp;&amp;item.animal===name)) tradeMessage=&#x27;You already have a pending offer for this animal. Cancel it first to change the price.&#x27;;
        else {
          requests.push({id:nextRequestId++,buyer:activePlayer,seller,animal:name,amount});
          tradeMessage=playerName(activePlayer)+&#x27; offered &#x27;+money(amount)+&#x27; to &#x27;+playerName(seller)+&#x27; for &#x27;+name+&#x27;. Awaiting the owner’s decision.&#x27;;
          saveState();
        }
        renderTrades();
      }
      function decideTrade(id,decision) {
        if(!gameStarted) return;
        syncPlayer();
        const request=requests.find(item=&gt;item.id===id);
        if(!request) return;
        const seller=getPlayer(request.seller),buyer=getPlayer(request.buyer);
        if(decision===&#x27;cancel&#x27;) {
          if(activePlayer!==request.buyer) return;
          requests=requests.filter(item=&gt;item.id!==id);
          tradeMessage=&#x27;Offer for &#x27;+request.animal+&#x27; cancelled.&#x27;;
        } else {
          if(activePlayer!==request.seller) return;
          if(decision===&#x27;decline&#x27;) {
            requests=requests.filter(item=&gt;item.id!==id);
            tradeMessage=playerName(activePlayer)+&#x27; declined the offer for &#x27;+request.animal+&#x27;.&#x27;;
          } else if(decision===&#x27;accept&#x27;) {
            if(!seller||!buyer||ownerOf(request.animal)!==request.seller) {
              requests=requests.filter(item=&gt;item.id!==id);
              tradeMessage=&#x27;This offer is no longer valid because ownership changed.&#x27;;
            } else if(buyer.cash&lt;request.amount) {
              tradeMessage=playerName(buyer.id)+&#x27; no longer has enough cash. The trade has not happened.&#x27;;
            } else {
              buyer.cash-=request.amount;
              seller.cash+=request.amount;
              seller.owned=seller.owned.filter(name=&gt;name!==request.animal);
              buyer.owned.push(request.animal);
              requests=requests.filter(item=&gt;item.animal!==request.animal);
              loadPlayer();
              tradeMessage=playerName(seller.id)+&#x27; sold &#x27;+request.animal+&#x27; to &#x27;+playerName(buyer.id)+&#x27; for &#x27;+money(request.amount)+&#x27;.&#x27;;
              turnMessage=tradeMessage;
            }
          } else return;
        }
        render();
        saveState();
      }
      function renderTrades() {
        const incoming=requests.filter(item=&gt;item.seller===activePlayer);
        const toggle=root.querySelector(&#x27;.trade-toggle&#x27;);
        toggle.textContent=&#x27;Trade&#x27;+(incoming.length?&#x27; · &#x27;+incoming.length+&#x27; incoming&#x27;:&#x27;&#x27;);
        toggle.setAttribute(&#x27;aria-expanded&#x27;,String(tradeOpen));
        root.querySelector(&#x27;.trade-panel&#x27;).hidden=!tradeOpen;
        const others=players.filter(player=&gt;player.id!==activePlayer);
        setOptions(ownerControl,others.map(player=&gt;({value:player.id,label:playerName(player.id)})),ownerControl.value);
        ownerControl.disabled=others.length===0;
        fillTradeProperties();
        root.querySelector(&#x27;.trade-message&#x27;).textContent=tradeMessage;
        const list=root.querySelector(&#x27;.trade-requests&#x27;);
        list.replaceChildren();
        const relevant=requests.filter(item=&gt;item.buyer===activePlayer||item.seller===activePlayer);
        if(!relevant.length) {const empty=document.createElement(&#x27;p&#x27;);empty.className=&#x27;trade-note&#x27;;empty.textContent=&#x27;No pending requests for &#x27;+playerName(activePlayer)+&#x27;.&#x27;;list.appendChild(empty);}
        relevant.forEach(request=&gt;{
          const row=document.createElement(&#x27;div&#x27;);row.className=&#x27;request-row&#x27;;
          const label=document.createElement(&#x27;span&#x27;);label.className=&#x27;request-text&#x27;;
          label.textContent=playerName(request.buyer)+&#x27; → &#x27;+playerName(request.seller)+&#x27;: &#x27;+request.animal+&#x27; for &#x27;+money(request.amount);
          row.appendChild(label);
          const actions=request.seller===activePlayer?[[&#x27;Accept&#x27;,&#x27;accept&#x27;],[&#x27;Decline&#x27;,&#x27;decline&#x27;]]:[[&#x27;Cancel request&#x27;,&#x27;cancel&#x27;]];
          actions.forEach(([title,action])=&gt;{
            const button=document.createElement(&#x27;button&#x27;);button.type=&#x27;button&#x27;;button.className=&#x27;game-button cursor-interaction&#x27;+(action===&#x27;accept&#x27;?&#x27;&#x27;:&#x27; secondary-button&#x27;);button.textContent=title;
            button.dataset.requestId=String(request.id);button.dataset.action=action;
            button.addEventListener(&#x27;click&#x27;,()=&gt;decideTrade(request.id,action));row.appendChild(button);
          });
          list.appendChild(row);
        });
      }
      function endTurn() {
        if(!gameStarted||turnPhase!==&#x27;action&#x27;) return;
        syncPlayer();
        const index=players.findIndex(player=&gt;player.id===activePlayer);
        activePlayer=players[(index+1)%players.length].id;
        loadPlayer();lastRoll=0;lastDice=[0,0];turnPhase=&#x27;roll&#x27;;
        selectedAnimal=animalGroups[track[position]]?track[position]:null;
        tradeOpen=requests.some(request=&gt;request.seller===activePlayer);
        tradeMessage=&#x27;&#x27;;turnMessage=playerName(activePlayer)+&#x27;’s turn. Roll the dice.&#x27;;
        render();saveState();
      }
      function startGame(event) {
        event.preventDefault();
        if(gameStarted) return;
        const count=Number(countControl.value);
        if(!Number.isSafeInteger(count)||count&lt;2) {root.querySelector(&#x27;.setup-message&#x27;).textContent=&#x27;Enter a whole number of at least 2 players.&#x27;;return;}
        players=Array.from({length:count},(_,i)=&gt;({id:i+1,position:0,cash:2000,owned:[],lastRoll:0}));
        activePlayer=1;loadPlayer();lastDice=[0,0];
        selectedAnimal=null;rentLevel=0;requests=[];nextRequestId=1;tradeOpen=false;tradeMessage=&#x27;&#x27;;turnPhase=&#x27;roll&#x27;;gameStarted=true;hasSavedGame=true;
        turnMessage=&#x27;Player 1’s turn. Everyone starts on Go. Roll the dice.&#x27;;
        render();saveState();
      }
      function continueGame() {
