<div id="animal-monopoly-map">
  <style>
    #animal-monopoly-map { color-scheme: light dark; --paper:light-dark(#faf8f2,#222923); --ink:light-dark(#23382d,#edf3ec); --line:light-dark(#bcc6bb,#58665c); --tile:light-dark(#fffef9,#2c342e); --soft:light-dark(#eaf0e5,#333e34); color:var(--ink); font:14px/1.4 system-ui,sans-serif; }
    #animal-monopoly-map * { box-sizing:border-box; }
    #animal-monopoly-map .board { display:grid; grid-template-columns:100px repeat(9,minmax(0,1fr)) 100px; grid-template-rows:minmax(60px,auto) repeat(9,minmax(36px,auto)) minmax(60px,auto); gap:1px; background:var(--line); border:1px solid var(--line); }
    #animal-monopoly-map .space { border:0; margin:0; border-radius:0; padding:15px 3px 5px; position:relative; background:var(--tile); color:var(--ink); font:500 12px/1.25 system-ui,sans-serif; overflow-wrap:normal; display:flex; align-items:center; justify-content:center; text-align:center; }

    #animal-monopoly-map .rent-table th { font-weight:400; }
    #animal-monopoly-map .rent-table th,#animal-monopoly-map .rent-table td { padding:3px 6px; border-bottom:1px solid var(--line); }
    #animal-monopoly-map .rent-table td { text-align:right; font-variant-numeric:tabular-nums; }
    #animal-monopoly-map .rent-table .shown-level { background:var(--soft); font-weight:500; }
    #animal-monopoly-map .detail-meta { font-size:12px; }
    #animal-monopoly-map .space::before { content:""; position:absolute; height:9px; inset:0 0 auto; background:var(--group,var(--soft)); }
    #animal-monopoly-map .side-left { padding:3px 14px 3px 3px; }
    #animal-monopoly-map .side-left::before { inset:0 0 0 auto; height:auto; width:9px; }
    #animal-monopoly-map .side-right { padding:3px 3px 3px 14px; }
    #animal-monopoly-map .side-right::before { inset:0 auto 0 0; height:auto; width:9px; }
    #animal-monopoly-map .side-top { padding:5px 2px 15px; }
    #animal-monopoly-map .side-top::before { inset:auto 0 0; }
    #animal-monopoly-map .corner { background:var(--soft); padding:8px; font-size:15px; }
    #animal-monopoly-map .corner::before,#animal-monopoly-map .mystery::before { display:none; }
    #animal-monopoly-map .mystery { font-weight:400; }
    #animal-monopoly-map .space[data-group] { background:var(--group); color:#111; padding:6px 3px; }
    #animal-monopoly-map .space[data-group]::before { display:none; }
    #animal-monopoly-map .space:is([data-group="Black"],[data-group="Brown"],[data-group="Dark blue"]) { color:white; }
    #animal-monopoly-map .space .piece { background:#fff; border-radius:4px; color:#14251b; --ink:#14251b; }

    #animal-monopoly-map .space[aria-pressed="true"] { box-shadow:inset 0 0 0 2px var(--ink); }
    #animal-monopoly-map .center { grid-column:2/11; grid-row:2/11; background:light-dark(#c7dfc8,#2c4939); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:16px; gap:12px; }
    #animal-monopoly-map .heading { font-size:22px; line-height:1.1; font-weight:500; letter-spacing:.04em; margin:0; }
    #animal-monopoly-map .subtitle { font-size:12px; margin:8px 0 0; }
    #animal-monopoly-map .deck { width:100px; min-height:65px; border:1px solid var(--line); border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--tile); transform:rotate(-7deg); font-size:14px; }
    #animal-monopoly-map .detail { min-height:66px; width:100%; font-size:13px; }
    #animal-monopoly-map .detail strong { font-weight:500; }
    #animal-monopoly-map .mobile { display:none; }
    #animal-monopoly-map .mobile-section { margin-top:16px; }
    #animal-monopoly-map .mobile-heading { margin:0 0 7px; font-size:14px; font-weight:500; }
    #animal-monopoly-map .mobile-spaces { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:1px; background:var(--line); }
    #animal-monopoly-map .mobile-spaces .space { min-height:76px; }
    #animal-monopoly-map .mobile-detail { margin-bottom:12px; }
    #animal-monopoly-map .trade-notice { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px; margin-bottom:12px; border-left:5px solid #ce942d; background:var(--soft); }
    #animal-monopoly-map .trade-notice[hidden] { display:none; }
    #animal-monopoly-map .counter-editor { flex-basis:100%; }
    #animal-monopoly-map .counter-editor input { width:7em; margin:6px; padding:8px; font:inherit; }
    #animal-monopoly-map .counter-editor summary { cursor:pointer; }
    #animal-monopoly-map .new-game { margin-top:16px; }
    #animal-monopoly-map .play-controls { display:flex; align-items:center; flex-wrap:wrap; gap:10px 16px; margin-bottom:6px; }
    #animal-monopoly-map .game-button { font:500 14px/1.3 system-ui,sans-serif; min-height:44px; border:1px solid var(--ink); border-radius:7px; background:var(--ink); color:var(--paper); padding:9px 16px; }
    #animal-monopoly-map .game-button:disabled { background:var(--soft); color:var(--ink); border-color:var(--line); }
    #animal-monopoly-map .die-face { width:46px; height:46px; flex-shrink:0; display:block; }
    #animal-monopoly-map .dice-pair { display:flex; align-items:center; gap:4px; }
    #animal-monopoly-map .dice-total { font-size:13px; font-variant-numeric:tabular-nums; }
    #animal-monopoly-map .turn-status { margin-bottom:12px; min-height:20px; font-size:13px; }
    #animal-monopoly-map .pieces { display:flex; flex-wrap:wrap; justify-content:center; gap:3px; width:100%; }
    #animal-monopoly-map .pieces[hidden] { display:none; }
    #animal-monopoly-map .piece { position:relative; width:24px; height:25px; display:inline-block; flex:none; }
    #animal-monopoly-map .piece::before { content:""; position:absolute; top:1px; left:4px; width:8px; height:8px; border-radius:50%; background:var(--piece); }
    #animal-monopoly-map .piece::after { content:""; position:absolute; top:10px; left:1px; width:14px; height:14px; clip-path:polygon(28% 0,72% 0,100% 100%,0 100%); border-radius:2px; background:var(--piece); }
    #animal-monopoly-map .piece-number { position:absolute; bottom:0; right:0; font:500 11px/1.2 system-ui,sans-serif; color:var(--ink); }
    #animal-monopoly-map .piece.is-active { outline:1px solid var(--ink); outline-offset:1px; border-radius:3px; }
    #animal-monopoly-map .space { flex-direction:column; gap:3px; }
    #animal-monopoly-map .roster { display:grid; grid-auto-flow:column; grid-auto-columns:minmax(135px,1fr); gap:6px; overflow-x:auto; margin-bottom:16px; }
    #animal-monopoly-map .roster-player { padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--tile); }
    #animal-monopoly-map .roster-player header { display:flex; align-items:center; gap:8px; font-weight:650; }
    #animal-monopoly-map .roster-player strong { display:block; margin:5px 0; font-size:clamp(26px,4vw,44px); line-height:1.15; font-variant-numeric:tabular-nums; }
    #animal-monopoly-map .roster-player ul { margin:4px 0 0; padding-left:1.2em; }
    #animal-monopoly-map .roster-player.active { border-color:var(--ink); background:var(--soft); }
    #animal-monopoly-map .setup { padding:24px; background:var(--paper); border:1px solid var(--line); border-radius:10px; }
    #animal-monopoly-map .setup-form { display:flex; flex-wrap:wrap; align-items:end; gap:12px; margin:16px 0; }
    #animal-monopoly-map .player-names { flex-basis:100%; display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr)); gap:12px; }
    #animal-monopoly-map .player-names select { min-height:40px; padding:6px; font:inherit; }
    #animal-monopoly-map .player-names label + label { margin-top:6px; }
    #animal-monopoly-map .player-names input { width:100%; }
    #animal-monopoly-map .roster-player header { overflow-wrap:anywhere; }
    #animal-monopoly-map .setup-form label { display:flex; flex-direction:column; gap:6px; }
    #animal-monopoly-map .setup input { width:110px; min-height:44px; font:16px system-ui,sans-serif; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--tile); color:var(--ink); }
    #animal-monopoly-map .setup[hidden],#animal-monopoly-map .game-content[hidden],#animal-monopoly-map .continue-game[hidden] { display:none; }
    #animal-monopoly-map .owned-mark { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:750; font-size:10px; }
    #animal-monopoly-map .owned-mark[hidden] { display:none; }
    #animal-monopoly-map .purchase-summary { display:flex; flex-wrap:wrap; justify-content:center; gap:5px 16px; margin:7px 0; }
    #animal-monopoly-map .buy-action { margin:9px 0 5px; }
    #animal-monopoly-map .group-members { margin:6px 0; }
    #animal-monopoly-map .group-rules { max-width:330px; margin:6px auto 0; font-size:12px; }
    #animal-monopoly-map .detail-title { font-size:18px; margin:0; font-weight:500; }
    #animal-monopoly-map .player-controls { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; margin-bottom:12px; padding-right:90px; }
    #animal-monopoly-map .player-controls select,#animal-monopoly-map .trade-form select,#animal-monopoly-map .trade-form input { min-height:44px; min-width:0; max-width:100%; padding:7px 10px; font:16px system-ui,sans-serif; border:1px solid var(--line); border-radius:6px; background:var(--tile); color:var(--ink); }
    #animal-monopoly-map .secondary-button { background:var(--tile); color:var(--ink); border-color:var(--line); }
    #animal-monopoly-map .trade-panel { margin-bottom:16px; padding:14px; background:var(--paper); border:1px solid var(--line); border-radius:8px; }
    #animal-monopoly-map .trade-panel[hidden] { display:none; }
    #animal-monopoly-map .trade-form { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); align-items:end; gap:10px; margin-top:10px; }
    #animal-monopoly-map .trade-form label { display:flex; flex-direction:column; gap:5px; font-size:12px; }
    #animal-monopoly-map .trade-note { margin:8px 0; font-size:12px; }
    #animal-monopoly-map .trade-message { margin:8px 0; font-size:13px; }
    #animal-monopoly-map .request-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; border-top:1px solid var(--line); padding:10px 0; }
    #animal-monopoly-map .request-text { flex:1 1 220px; font-size:13px; }
    #animal-monopoly-map .bulletin { background:var(--soft); border-left:4px solid #528460; padding:8px 12px; }
    #animal-monopoly-map .roster-player ul { max-height:3.5em; overflow:auto; }
    #animal-monopoly-map .board .space[data-group] { padding:2px; gap:0; }
    #animal-monopoly-map .side-left .rent-label,#animal-monopoly-map .side-right .rent-label { font-size:10px; }
    #animal-monopoly-map .turn-status { margin:4px 0; }
    #animal-monopoly-map .mobile-track { display:flex; overflow-x:auto; }
    #animal-monopoly-map .mobile-track .space { flex:0 0 90px; min-height:80px; }
    @media(max-width:480px) { #animal-monopoly-map .trade-form { grid-template-columns:1fr; } }
    @media(max-width:700px) { #animal-monopoly-map .board { display:none; } #animal-monopoly-map .mobile { display:block; } }
  </style>
  <section class="setup" aria-label="Game setup">
    <h2 class="heading">Set up your players</h2>
    <form class="setup-form">
      <label for="monopoly-player-count">Number of players<input id="monopoly-player-count" type="number" min="2" step="1" value="3" required></label>
      <div class="player-names"></div>
      <button type="submit" class="game-button cursor-interaction">Start new game</button>
    </form>
    <p class="setup-message" role="status">Everyone starts on Go with $2,000. A new game starts with no owned properties.</p>
    <button type="button" class="game-button secondary-button continue-game cursor-interaction" hidden>Continue saved game</button>
  </section>
  <div class="game-content" hidden>
  <div class="roster" aria-label="Players, pieces and positions"></div>
  <aside class="trade-notice" hidden>
    <strong role="status"></strong>
    <button type="button" class="game-button secondary-button review-trades">Review offers</button>
  </aside>
  <p class="bulletin" role="status" hidden></p>
  <div class="trade-requests" aria-label="Pending trade requests"></div>
  <div class="play-controls">
    <div class="dice-pair" role="group" aria-label="Two dice">
      <canvas class="die-face die-one" width="144" height="144" role="img" aria-label="First die ready to roll"></canvas>
      <canvas class="die-face die-two" width="144" height="144" role="img" aria-label="Second die ready to roll"></canvas>
    </div>
    <span class="dice-total" aria-live="polite">Roll both dice</span>
    <button type="button" class="game-button roll-button cursor-interaction">Roll dice</button>
    <button type="button" class="game-button secondary-button end-turn cursor-interaction" disabled>End turn</button>
    <button type="button" class="game-button secondary-button trade-toggle cursor-interaction" aria-expanded="false" aria-controls="monopoly-trade-panel">Trade</button>
  </div>
  <div class="landing-choice" hidden>
    <button type="button" class="game-button landing-buy"></button>
    <button type="button" class="game-button secondary-button leave">Leave it</button>
  </div>
  <div class="turn-status" role="status">Player 1 starts on Go. Roll to move.</div>
  <section id="monopoly-trade-panel" class="trade-panel" aria-label="Property trades" hidden>
    <h3 class="detail-title">Trade a property</h3>
    <form class="trade-form">
      <label>Action<select class="trade-mode"><option value="buy">Buy a property</option><option value="sell">Sell a property</option></select></label>
      <label><span class="partner-label">Owner</span><select class="trade-owner"></select></label>
      <label>Animal<select class="trade-property" aria-label="Property"></select></label>
      <label>Price ($)<input class="trade-price" aria-label="Offer amount" type="number" min="1" step="1" inputmode="numeric" required></label>
      <button type="submit" class="game-button request-button cursor-interaction">Request to buy</button>
    </form>
    <p class="trade-note"></p>
    <p class="trade-message" role="status"></p>
  </section>
  <div class="board" role="group" aria-label="Animal Monopoly board: forty spaces, Go at bottom right, Jail at bottom left, $500 at top left, Go to Jail at top right">
    <div class="center">
      <div><h2 class="heading">ANIMAL MONOPOLY</h2><p class="subtitle">Roll, buy & trade preview</p></div>
      <div class="detail" aria-live="polite"></div>
    </div>
  </div>
  <div class="mobile"><div class="mobile-track" aria-label="Board spaces"></div><div class="mobile-detail" aria-live="polite">Animal Monopoly · 40 spaces</div></div>
  <button type="button" class="game-button secondary-button new-game">New game</button>
  </div>
  <script>
    (() => {
      const root = document.getElementById('animal-monopoly-map');
      const groups = {
        'Brown':{color:'#935d36',price:50,baseRent:20,animals:['Grizzly bear','Sloth','Mouse']},
        'Light blue':{color:'#58c5ed',price:70,baseRent:30,animals:['Polar bear','Penguin','Dolphin']},
        'Pink':{color:'#ed88ba',price:90,baseRent:40,animals:['Gazelle','Cat','Rabbit']},
        'Purple':{color:'#9a71ca',price:110,baseRent:50,animals:['Gorilla','Seal','Wolf']},
        'Orange':{color:'#ed963f',price:130,baseRent:60,animals:['Otter','Kangaroo','Tiger']},
        'Red':{color:'#dc4c53',price:150,baseRent:70,animals:['Eagle','Fox','Flamingo']},
        'Yellow':{color:'#e5ce38',price:170,baseRent:80,animals:['Falcon','Rhino','Cheetah']},
        'Light green':{color:'#a4d963',price:190,baseRent:90,animals:['Monkey','Giraffe','Koala']},
        'Dark green':{color:'#2e8761',price:210,baseRent:100,animals:['Crocodile','Cow','Turtle']},
        'Dark blue':{color:'#3968c8',price:230,baseRent:110,animals:['Zebra','Shark','Hippo']},
        'Black':{color:'#262729',price:250,baseRent:120,animals:['Panda','Elephant']}
      };
      const sides = [
        {heading:'Bottom · Go → Jail',names:['Dolphin','Tiger','Giraffe','Rhino','Mystery Card','Hippo','Gazelle','Eagle','Grizzly bear'],draft:[0,1,3]},
        {heading:'Left · Jail → $500',names:['Zebra','Falcon','Monkey','Shark','Mystery Card','Polar bear','Panda','Gorilla','Crocodile'],draft:[]},
        {heading:'Top · $500 → Go to Jail',names:['Fox','Otter','Cat','Elephant','Mystery Card','Turtle','Seal','Rabbit','Mouse'],draft:[0,1,2,3,4,5,6,7,8]},
        {heading:'Right · Go to Jail → Go',names:['Penguin','Sloth','Flamingo','Cheetah','Mystery Card','Wolf','Kangaroo','Koala','Cow'],draft:[0,1,2,3,4,5,6,7,8]}
      ];
      const board=root.querySelector('.board');
      const mobile=root.querySelector('.mobile');
      const animalGroups=Object.fromEntries(Object.entries(groups).flatMap(([group,data])=>data.animals.map(name=>[name,group])));
      const buttons=[];
      const allTiles=[];
      const levels=['No houses','1 house','2 houses','3 houses','4 houses','Hotel'];
      const multipliers=[1,2,4,6,8,10];
      const cornerNames=['Go','Jail','$500','Go to Jail'];
      const track=sides.flatMap((side,i)=>[cornerNames[i],...side.names]);
      let selectedAnimal=null;
      let position=0;
      let cash=2000;
      let owned=new Set();
      let lastRoll=0;
      let lastDice=[0,0];
      let turnMessage='Player 1 starts on Go. Roll to move.';
      let players=[{id:1,position:0,cash:2000,owned:[],lastRoll:0}];
      let activePlayer=1;
      let requests=[];
      let nextRequestId=1;
      let tradeOpen=false;
      let tradeMessage='';
      let gameStarted=false;
      let hasSavedGame=false;
      let tradeBulletin='';
      let leftProperty=false;
      let turnPhase='roll';
      let cpuTimer;
      const money=value=>'$'+value.toLocaleString('en-US');
      const playerName=id=>getPlayer(id)?.name || 'Player '+id;
      const getPlayer=id=>players.find(player=>player.id===id);
      const countControl=root.querySelector('#monopoly-player-count');
      const tradeMode=root.querySelector('.trade-mode');
      const recipient=request=>request.kind==='sell'?request.buyer:request.seller;
      const ownerControl=root.querySelector('.trade-owner');
      const propertyControl=root.querySelector('.trade-property');
      const offerControl=root.querySelector('.trade-price');
      const purchasePrice=name=>groups[animalGroups[name]].price*2;
      const panels=[root.querySelector('.detail'),root.querySelector('.mobile-detail')];
      function syncPlayer() {
        Object.assign(getPlayer(activePlayer),{position,cash,owned:[...owned],lastRoll});
      }
      function loadPlayer() {
        const player=getPlayer(activePlayer);
        position=player.position; cash=player.cash; owned=new Set(player.owned); lastRoll=player.lastRoll;
      }
      function ownerOf(name) {
        if(owned.has(name)) return activePlayer;
        return players.find(player=>player.id!==activePlayer&&player.owned.includes(name))?.id??null;
      }
      function select(group,name) {
        selectedAnimal=name;
        const data=groups[group];
        buttons.forEach(button=>{
          button.classList.toggle('is-related',button.dataset.group===group);
          button.setAttribute('aria-pressed',String(button.dataset.name===name));
        });
        const rows=levels.map((label,i)=>'<tr'+(i===0?' class="shown-level"':'')+'><th scope="row">'+label+'</th><td>'+money(data.baseRent*multipliers[i])+'</td></tr>').join('');
        const price=purchasePrice(name);
        const owner=ownerOf(name);
        const isOwned=owner===activePlayer;
        const otherOwner=owner!==null&&!isOwned;
        const onProperty=track[position]===name;
        const canBuy=gameStarted&&pendingPurchase()&&onProperty&&owner===null&&cash>=price;
        const groupCount=data.animals.filter(animal=>owned.has(animal)).length;
        const buttonText=isOwned?'Owned by '+playerName(owner):otherOwner?'Request to buy from '+playerName(owner):!onProperty?'Land here to buy':turnPhase!=='action'?'Roll to move first':cash<price?'Need '+money(price-cash)+' more':leftProperty?'Left unowned':'Buy '+name+' · '+money(price);
        const markup='<h3 class="detail-title">'+name+'</h3><div class="detail-meta">'+group+' group · '+(owner!==null?'Owner: <span class="owner-name"></span>':'Unowned')+'</div><div class="purchase-summary"><span>Bank price: <strong>'+money(price)+'</strong></span><span>Your cash: <strong>'+money(cash)+'</strong></span></div><details><summary>Rent and building details</summary><table class="rent-table" aria-label="Suggested rent for '+name+'"><tbody>'+rows+'</tbody></table><div class="detail-meta">House: '+money(data.price)+' · Hotel construction: '+money(data.price*5)+' total<div class="group-members">'+data.animals.map(animal=>animal+(owned.has(animal)?' ✓':'')).join(' · ')+'</div>Your group: '+groupCount+'/'+data.animals.length+'</div></details><div class="buy-action"><button type="button" class="game-button buy-button cursor-interaction"'+(canBuy||otherOwner?'':' disabled')+'></button></div><div class="group-rules">Own the full group to build. Uneven building is allowed. The fifth house becomes a hotel automatically.</div>';
        panels.forEach(panel=>{
          panel.innerHTML=markup;
          if(owner!==null) panel.querySelector('.owner-name').textContent=playerName(owner);
          panel.querySelector('.buy-action').hidden=Boolean(onProperty && pendingPurchase());
          panel.querySelector('.buy-button').textContent=buttonText;
          panel.querySelector('.buy-button').addEventListener('click',()=>otherOwner?openTrade(name):buy(name));
        });
      }
      function showSpecial() {
        selectedAnimal=null;
        const name=track[position];
        buttons.forEach(button=>{button.classList.toggle('is-related',false);button.setAttribute('aria-pressed','false');});
        const description={Go:'Collect $200 each time your move reaches or passes Go.',Jail:'Jail and release rules still need to be set.','$500':'Collect $500 when you land here.','Go to Jail':'Jail movement is not active in this preview.','Mystery Card':'15 cards proposed. Card drawing is not active in this preview.'}[name];
        panels.forEach(panel=>{
          panel.innerHTML='<h3 class="detail-title">'+name+'</h3><p>'+description+'</p><div class="detail-meta"><span class="current-name"></span> · '+money(cash)+' · '+owned.size+' animals owned</div>';
          panel.querySelector('.current-name').textContent=playerName(activePlayer);
        });
      }
      function refreshPanel() {
        if(selectedAnimal&&animalGroups[selectedAnimal]) select(animalGroups[selectedAnimal],selectedAnimal);
        else showSpecial();
      }
      function pendingPurchase() {
        const name=track[position];
        return turnPhase==='action' && !leftProperty && animalGroups[name] && ownerOf(name)===null;
      }
      function buy(name) {
        if(!gameStarted||!pendingPurchase()||track[position]!==name||ownerOf(name)!==null||!animalGroups[name]) return;
        const price=purchasePrice(name);
        if(cash<price) return;
        cash-=price;
        owned.add(name);
        turnMessage='Bought '+name+' for '+money(price)+'. Cash remaining: '+money(cash)+'.';
        render();
        saveState();
      }
      const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
      const dieValue=()=>1+Math.floor(Math.random()*6);

          activePlayer=1;
          if(Number.isInteger(state.position)&&state.position>=0&&state.position<40) position=state.position;
          if(Number.isFinite(state.cash)&&state.cash>=0) cash=state.cash;
          if(Array.isArray(state.owned)) owned=new Set(state.owned.filter(name=>Object.hasOwn(animalGroups,name)));
          if(Number.isInteger(state.lastRoll)&&state.lastRoll>=0&&state.lastRoll<=6) lastRoll=state.lastRoll;
          turnMessage='Player 1 is on '+track[position]+'.';
        }
        if((state?.gameVersion===2||state?.gameVersion===3)&&Array.isArray(state.players)&&state.players.length) {
          const seenIds=new Set(),seenAnimals=new Set();
          const restored=state.players.filter(player=>{
            if(!player||!Number.isSafeInteger(player.id)||player.id<1||seenIds.has(player.id)) return false;
            seenIds.add(player.id);return true;
          }).map(player=>({
            id:player.id,cpu:player.cpu===true,
            name:typeof player.name==='string'?player.name.trim():'',
            position:Number.isInteger(player.position)&&player.position>=0&&player.position<40?player.position:0,
            cash:Number.isSafeInteger(player.cash)?player.cash:2000,
            lastRoll:Number.isInteger(player.lastRoll)&&player.lastRoll>=0&&player.lastRoll<=12?player.lastRoll:0,
            owned:(Array.isArray(player.owned)?player.owned:[]).filter(name=>{
              if(!Object.hasOwn(animalGroups,name)||seenAnimals.has(name)) return false;
              seenAnimals.add(name);return true;
            })
          }));
          if(restored.length) {
            players=restored;
            activePlayer=getPlayer(state.activePlayer)?state.activePlayer:players[0].id;
            loadPlayer();
            const seenRequests=new Set();
            requests=(Array.isArray(state.requests)?state.requests:[]).filter(request=>{
              if(!request||!Number.isSafeInteger(request.id)||request.id<1||seenRequests.has(request.id)||!getPlayer(request.buyer)||!getPlayer(request.seller)||request.buyer===request.seller||!Object.hasOwn(animalGroups,request.animal)||ownerOf(request.animal)!==request.seller||!Number.isSafeInteger(request.amount)||request.amount<=0) return false;
              seenRequests.add(request.id);return true;
            }).map(request=>({id:request.id,counter:request.counter===true,kind:request.kind==='sell'?'sell':'buy',buyer:request.buyer,seller:request.seller,animal:request.animal,amount:request.amount}));
            nextRequestId=Math.max(0,...requests.map(request=>request.id))+1;
            tradeOpen=Boolean(state.tradeOpen);
            leftProperty=state.leftProperty===true;
            tradeBulletin=typeof state.tradeBulletin==='string'?state.tradeBulletin:'';
            hasSavedGame=true;
            gameStarted=state.gameVersion===3&&state.gameStarted===true&&players.length>=2;
            turnPhase=state.gameVersion===3&&state.turnPhase==='action'?'action':'roll';
            lastDice=turnPhase==='action'&&Array.isArray(state.lastDice)&&state.lastDice.length===2&&state.lastDice.every(value=>Number.isInteger(value)&&value>=1&&value<=6)&&state.lastDice[0]+state.lastDice[1]===lastRoll?[...state.lastDice]:[0,0];
            countControl.value=String(Math.max(2,players.length));
            if(!gameStarted) updateNameFields();
            turnMessage=typeof state.turnMessage==='string'?state.turnMessage:playerName(activePlayer)+'’s turn. '+(turnPhase==='action'?'Finish your action, then End turn.':'Roll the dice.');
          }
        }
        render();
      }
      const state=window.openai?.widgetState?.modelContent;
      applyState(state);
      updateNameFields();
      countControl.addEventListener('input',updateNameFields);
      root.querySelector('.new-game').addEventListener('click',()=>{
        gameStarted=false;
        updateNameFields();
        root.querySelector('.setup-message').textContent='Starting a new game replaces the saved game.';
        render();
        nameFields.querySelector('input').focus();
      });
      root.querySelector('.landing-buy').addEventListener('click',()=>buy(track[position]));
      root.querySelector('.leave').addEventListener('click',()=>{
        if(!pendingPurchase()) return;
        leftProperty=true;
        turnMessage=playerName(activePlayer)+' left '+track[position]+' unowned.';
        render();saveState();
      });
      root.querySelector('.roll-button').addEventListener('click',roll);
      root.querySelector('.end-turn').addEventListener('click',endTurn);
      // Handle local actions directly because the embedded board blocks form submission.
      function bindAction(form, action) {
        const activate = event => {
          event.preventDefault();
          if (form.reportValidity()) action(event);
        };
        form.querySelector('button').addEventListener('click', activate);
        form.addEventListener('keydown', event => {
          if (event.key === 'Enter' && event.target.tagName === 'INPUT') activate(event);
        });
      }
      bindAction(root.querySelector('.setup-form'), startGame);
      root.querySelector('.continue-game').addEventListener('click',continueGame);
      root.querySelector('.trade-toggle').addEventListener('click',()=>{if(!gameStarted)return;tradeOpen=!tradeOpen;renderTrades();saveState();});
      root.querySelector('.review-trades').addEventListener('click',()=>{
        tradeOpen=true;
        renderTrades();
        root.querySelector('.trade-requests [data-action="accept"]')?.focus();
      });
      tradeMode.addEventListener('change',()=>{tradeMessage='';renderTrades();});
      ownerControl.addEventListener('change',()=>fillTradeProperties());
      propertyControl.addEventListener('change',()=>{offerControl.value=propertyControl.value?String(purchasePrice(propertyControl.value)):'';});
      bindAction(root.querySelector('.trade-form'), requestTrade);
      window.addEventListener('openai:set_globals',event=>{
        if(turnPhase==='rolling') return;
        applyState(event.detail?.globals?.widgetState?.modelContent);
      });
    })();
  </script>
</div>
